<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Forms</title>
  </head>
  <body>
    <!--
      Static form for Netlify Forms build-time detection (Next.js renders the
      real form on the client, which Netlify's crawler can't see). Not
      user-facing. Field names must match src/components/ContactForm.tsx.
    -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="company" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>
  </body>
</html>
